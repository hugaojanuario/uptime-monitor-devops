name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: uptime-monitor:${{ github.sha }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        ## pode ser feito tambem da seguinte maneira: run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -U "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
        ##porem atualmente é feito com:
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildar imagem do commit e push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            devhugojanuario/uptime-monitor:v1
            devhugojanuario/uptime-monitor:v1

      - name: Validar sintaxe do docker-compose
        run: docker compose -f docker-compose.prod.yml config

        ##Teste da API
      - name: Criar .env de teste
        run: |
          cat > .env <<EOF
          DB_NAME=uptime
          DB_USER=ci
          DB_PASSWORD=ci-nao-e-secret
          EOF

      - name: Subir a stack
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Esperar a API responder
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          echo "API nao responder em 60s"
          exit 1

      - name: Logs (somente se algo falhou)
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Derrubar tudo
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v