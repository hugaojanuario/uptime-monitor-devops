name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: devhugojanuario/uptime-monitor:${{ github.sha }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #BUILD (sem publicar)
      - name: Buildar imagem do commit
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.APP_IMAGE }}

      #TESTE
      - name: Validar sintaxe do docker-compose
        run: docker compose -f docker-compose.prod.yml config

      - name: Criar .env de teste
        run: |
          cat > .env <<EOF
          DB_NAME=uptime
          DB_USER=ci
          DB_PASSWORD=ci-nao-e-secret
          EOF

      - name: Subir a stack
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Esperar a API responder
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          echo "API nao respondeu em 60s"
          exit 1

      - name: Logs (somente se algo falhou)
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Derrubar tudo
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

      # PUBLICA (so em push na main )
      - name: Login no Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagem
        if: github.event_name == 'push'
        run: |
          docker tag "$APP_IMAGE" devhugojanuario/uptime-monitor:latest
          docker push "$APP_IMAGE"
          docker push devhugojanuario/uptime-monitor:latest
